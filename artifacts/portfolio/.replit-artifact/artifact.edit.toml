kind = "web"
previewPath = "/"
title = "KIQA DEV Portfolio"
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/portfolio", "run", "build" ]
run = "pnpm --filter @workspace/portfolio run start"

[services.env]
PORT = "21113"
BASE_PATH = "/"
